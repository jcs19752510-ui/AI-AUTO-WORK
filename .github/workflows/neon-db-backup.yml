# Neon PostgreSQL -> Cloudflare R2 일일 백업 워크플로
#
# 근거: docs/harness/decisions.md DEC-010(GitHub Actions 스케줄 pg_dump -> R2
# backup-private 버킷), DEC-032/DEC-033(이 워크플로의 세부 구조).
# 03-system-design.md §1.1(아키텍처), §3.3(destructive 마이그레이션 전 수동 백업
# 원칙), §5.4(시크릿 관리), §7.3(RPO/RTO), §7.5(R2 Lifecycle 14일) 참고.
#
# 목적: Neon 무료 티어 PITR(6시간) 한계를 보완하기 위해 매일 1회 전체 DB를
# pg_dump로 떠서 R2 backup-private 버킷에 저장한다. Render(앱)가 아니라
# GitHub Actions에서 실행되므로 앱 장애와 백업 실행이 서로 독립적이다
# (장애 격리, §1.1).
#
# 로그/감사: 이 워크플로의 실행 이력(Actions 탭) 자체가 "정의된 주기대로
# 수행되었는지"를 확인하는 로그다(02-planning.md §5 KPI 7). 별도의 백업
# 이력 DB 테이블을 두지 않는다(03 §3.2 "의도적으로 만들지 않은 모델" 참고,
# 과설계 방지). 실패 시 GitHub 기본 기능으로 리포지토리 소유자에게 이메일
# 알림이 간다(03 §7.2/§6.4, GitHub 표준 기능이므로 이 워크플로가 별도로
# 구현할 것은 없다 — 단, 수신 계정의 알림 설정이 켜져 있어야 하며 이는
# webapp/BACKUP_RESTORE_GUIDE.md §5에서 운영자 확인 항목으로 안내한다).

name: Neon DB Backup to R2

on:
  schedule:
    # 매일 UTC 18:00 = KST 03:00(익일), DEC-010의 "1일 1회" 정책.
    # GitHub Actions cron은 정시 실행을 보장하지 않는 best-effort 스케줄러다
    # (부하가 높을 때 수 분~수십 분 지연될 수 있음, GitHub 공식 문서 명시 사항).
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유(예: destructive 마이그레이션 배포 직전 수동 백업, 03 §3.3-3)"
        required: false
        default: "manual backup"

permissions:
  contents: read

concurrency:
  group: neon-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify required secrets are present
        env:
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          missing=0
          for var in NEON_BACKUP_DATABASE_URL R2_BACKUP_ACCESS_KEY_ID R2_BACKUP_SECRET_ACCESS_KEY R2_BACKUP_BUCKET_NAME R2_ENDPOINT_URL; do
            value="${!var:-}"
            if [ -z "$value" ]; then
              echo "::error::필수 GitHub Actions Secret이 설정되지 않았습니다: $var (webapp/BACKUP_RESTORE_GUIDE.md §4 참고)"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Install PostgreSQL client (pg_dump) — PGDG 최신판 사용
        # DEF-10-03(10단계 배포테스트, High→Medium): ubuntu-latest 기본 apt
        # 저장소의 postgresql-client는 Neon 실서버 PostgreSQL 메이저 버전보다
        # 낮을 수 있고, pg_dump는 자신보다 "더 새로운" 서버를 지원하지 않는다
        # (공식 문서: pg_dump는 자신과 같거나 더 낮은 서버 버전만 안전하게
        # 지원). 기본 apt 대신 PostgreSQL 공식 APT 저장소(PGDG,
        # apt.postgresql.org)를 등록해 항상 최신 메이저 버전의 postgresql-client를
        # 설치하면, Neon이 어떤 최신 PostgreSQL 메이저 버전을 쓰든 client가
        # server보다 뒤처지는 경우가 구조적으로 없어진다.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client
          pg_dump --version

      - name: Dump Neon PostgreSQL and compress
        env:
          NEON_BACKUP_DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_FILE="db-backup-${TIMESTAMP}.sql.gz"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"
          # --no-owner/--no-privileges: 백업용 계정이 앱 런타임 계정과 다른
          # 권한을 가질 수 있으므로(§5.4 최소 권한 원칙) 복구 시 OWNER TO/GRANT
          # 실패로 복구가 중단되지 않게 한다.
          # --clean --if-exists: 기존 스키마가 남아있는 대상 DB에 복구해도
          # (덮어쓰기 시나리오) 안전하게 재적용 가능하도록 한다(BACKUP_RESTORE_GUIDE.md 참고).
          pg_dump --no-owner --no-privileges --clean --if-exists --verbose \
            "$NEON_BACKUP_DATABASE_URL" | gzip > "${BACKUP_FILE}"

      - name: Verify dump is non-empty
        run: |
          set -euo pipefail
          size="$(stat -c%s "${BACKUP_FILE}")"
          echo "백업 파일 크기: ${size} bytes"
          if [ "${size}" -le 0 ]; then
            echo "::error::pg_dump 결과 파일이 비어 있습니다 (${BACKUP_FILE})"
            exit 1
          fi

      - name: Ensure R2 lifecycle rule (14-day expiry) on backup-private bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_REGION: ${{ secrets.R2_REGION }}
        run: |
          set -euo pipefail
          printf '%s' '{"Rules":[{"ID":"expire-db-backups-after-14-days","Filter":{"Prefix":"db-backups/"},"Status":"Enabled","Expiration":{"Days":14}}]}' > lifecycle.json
          aws s3api put-bucket-lifecycle-configuration \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --region "${R2_REGION:-auto}" \
            --bucket "$R2_BACKUP_BUCKET_NAME" \
            --lifecycle-configuration file://lifecycle.json

      - name: Upload backup to R2 (backup-private bucket)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_REGION: ${{ secrets.R2_REGION }}
        run: |
          set -euo pipefail
          aws s3 cp "${BACKUP_FILE}" "s3://${R2_BACKUP_BUCKET_NAME}/db-backups/${BACKUP_FILE}" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --region "${R2_REGION:-auto}"

      - name: Verify upload succeeded
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_REGION: ${{ secrets.R2_REGION }}
        run: |
          set -euo pipefail
          aws s3api head-object \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --region "${R2_REGION:-auto}" \
            --bucket "$R2_BACKUP_BUCKET_NAME" \
            --key "db-backups/${BACKUP_FILE}"
          echo "백업 업로드 확인 완료: db-backups/${BACKUP_FILE}"

      - name: Remove local backup file
        if: always()
        run: rm -f "${BACKUP_FILE:-}" lifecycle.json
